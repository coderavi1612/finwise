<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  
  <!-- Wise Owl / Geometric Growth Shapes -->
  <g transform="translate(64, 64)">
    <!-- Left Wing / Bar 1 -->
    <rect x="64" y="224" width="48" height="128" rx="24" fill="url(#primary-grad)" opacity="0.6" />
    
    <!-- Center Body / Bar 2 -->
    <rect x="144" y="160" width="48" height="192" rx="24" fill="url(#primary-grad)" opacity="0.8" />
    
    <!-- Right Wing / Bar 3 -->
    <rect x="224" y="96" width="48" height="256" rx="24" fill="url(#primary-grad)" />
    
    <!-- Owl Eyes / Insight Nodes -->
    <circle cx="168" cy="112" r="28" fill="#1E293B" stroke="url(#accent-grad)" stroke-width="8" />
    <circle cx="168" cy="112" r="10" fill="url(#accent-grad)" />
    
    <circle cx="280" cy="112" r="28" fill="#1E293B" stroke="url(#accent-grad)" stroke-width="8" />
    <circle cx="280" cy="112" r="10" fill="url(#accent-grad)" />

    <!-- Rising Growth Path Line -->
    <path d="M 64 288 L 168 192 L 280 96 L 352 144" fill="none" stroke="url(#accent-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    
    <!-- Golden Light Node at the peak -->
    <circle cx="280" cy="96" r="16" fill="#FFFFFF" filter="url(#glow)" />
    <circle cx="280" cy="96" r="10" fill="url(#accent-grad)" />
  </g>
</svg>
